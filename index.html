<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo_Project</title>

    <!-- Boot Strap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- task report -->
    <div class="container-fluid my-3">
        <div class="row border rounded m-1 py-sm-2">
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">All</div>
                <div class="p-2 text-center" id="labAll">1</div>
            </div>
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Active</div>
                <div class="p-2 text-center" id="labActive">1</div>
            </div>
            <div class="col-4">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Complete</div>
                <div class="p-2 text-center" id="labComplete">1</div>
            </div>
        </div>
    </div>

    <!-- Add task, filter & render task -->
    <div class="container-fluid">
        <div class="row">

            <!-- Add task & filter -->
            <div class="col-12 col-md-5 col-lg-4 col-xl-3 d-flex flex-column">

                <!-- Add task -->
                <form class="m-1 d-flex flex-column  border rounded p-3" id="addForm">
                    <label class="form-label">Add new task</label>
                    <input type="text" class="form-control mb-3" id="inpTask" placeholder="Enter task name...">
                    <label class="form-label">Priority</label>
                    <select id="PrioritySelector" class="form-select mb-3">
                        <option value="3">Low</option>
                        <option value="2">Medium</option>
                        <option value="1">High</option>
                    </select>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">From:</label>
                            <input type="date" class="form-control" id="from">
                        </div>
                        <div class="col-6">
                            <label class="form-label">To:</label>
                            <input type="date" class="form-control" id="deadline">
                        </div>
                    </div>
                    <button type="submit"
                        class="btn btn-primary rounded-5 align-self-end">Add<span>&plus;</span></button>
                </form>

                <!-- Filter -->
                <div class="card mx-1 mt-3">
                    <div class="card-header text-center fw-bold">Filter</div>
                    <form class="card-body d-flex justify-content-around">
                        <div>
                            <input type="checkbox" class="form-check-input" value="active" id="Active">
                            <label class="form-check-label">Active</label>
                        </div>
                        <div>
                            <input type="checkbox" class="form-check-input" value="complete" id="Complete">
                            <label class="form-check-label">Complete</label>
                        </div>
                        <div>
                            <input type="checkbox" class="form-check-input" value="priority" id="Priority">
                            <label class="form-check-label">Priority</label>
                        </div>
                    </form>
                </div>

            </div>

            <!-- task render -->
            <div class="col-12 col-md-7 col-lg-8 col-xl-9">

                <!-- Search bar -->
                <div class="d-flex justify-content-center align-items-center mx-1 mt-3 mt-md-1">
                    <form class="input-group" id="searchBar">
                        <span class="material-symbols-outlined text-secondary input-group-text" id="icon">search</span>
                        <input type="text" class="form-control" id="search" placeholder="Search...">
                    </form>
                </div>

                <div class="mx-1 mt-3 mt-sm-4" id="taskFrame">
                    <!-- Output -->

                    
                    <div class="border rounded d-flex flex-column mb-3">
                        <div
                            class="bg-light rounded-top d-flex position-relative align-items-center justify-content-center  border-bottom py-2">
                            <span class="badge position-absolute start-0 ms-2 bg-info">low</span>
                            <p class="m-0 ms-4">00/00/00</p>
                        </div>
                        <div class="d-flex p-2 justify-content-between align-items-center">
                            <form class="d-flex align-items-center">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label ms-1">test</label>
                            </form>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary material-symbols-outlined">edit</button>
                                <button class="btn btn-danger material-symbols-outlined">delete</button>
                            </div>
                        </div>
                    </div>

                    <div class="border rounded d-flex flex-column mb-3">
                        <div class="bg-light rounded-top d-flex position-relative align-items-center justify-content-center  border-bottom py-2">
                            <span class="badge position-absolute start-0 ms-2 bg-info">low</span>
                            <p class="m-0 ms-4">00/00/00</p>
                        </div>
                        <div class="d-flex p-2 justify-content-between align-items-center">
                            <form class="d-flex justify-content-between align-items-center">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label ms-1 fs-4 fw-bold">test</label>
                            </form>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary material-symbols-outlined">edit</button>
                                <button class="btn btn-danger material-symbols-outlined">delete</button>
                            </div>
                        </div>
                        <div class="d-flex flex-column ms-5 gap-2 mb-4 ps-4">
                            <form class="d-flex align-items-center">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label ms-1">test</label>
                            </form>
                            <form class="d-flex align-items-center">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label ms-1">test</label>
                            </form>
                            <form class="d-flex align-items-center">
                                <input type="checkbox" class="form-check-input">
                                <label class="form-check-label ms-1">test</label>
                            </form>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>

    <!------------------------------------------- modal -------------------------------------------->

    <!-- Delete Modal -->
    <div class="modal fade" id="delModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Delete task</h1>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Do you want to Delete this task?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" id="cancel">Cancel</button>
                    <button class="btn btn-danger" id="delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <form id="editForm" class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Edit</h1>
                    <button type="button" class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="container d-flex flex-column">
                        <div class="row mb-3">
                            <label class="col-12 form-label p-0">Category</label>
                            <input name="inpCategory" type="text" class="col-12 form-control"
                                placeholder="Enter category name...">
                        </div>
                        <div class="row mb-3">
                            <label class="form-label p-0">Priority</label>
                            <select id="prioritySelector" class="form-select">
                                <option value="3">low</option>
                                <option value="2">Medium</option>
                                <option value="1">High</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6 ps-0">
                                <label class="form-label">From:</label>
                                <input class="form-control" name="from" type="date">
                            </div>
                            <div class="col-6 pe-0">
                                <label class="form-label">To:</label>
                                <input type="date" id="to" class="form-control">
                            </div>
                        </div>
                        <div class="row mb-3" id="inpTaskFrame">
                            <!-- output  -->
                        </div>
                        <div class="row">
                            <button class="btn btn-outline-primary" type="button" id="Add">Add
                                Task<span>&plus;</span></button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success" id="btnSaveEdit">Save</button>
                </div>
            </form>
        </div>

    </div>
    <!-- Boot Strap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
