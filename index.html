<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo_Project</title>

    <!-- Boot Strap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- task report -->
    <div class="container-fluid my-3">
        <div class="row border rounded m-1 py-sm-2">
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">All</div>
                <div class="p-2 text-center" id="labAll">1</div>
            </div>
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Active</div>
                <div class="p-2 text-center" id="labActive">1</div>
            </div>
            <div class="col-4">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Complete</div>
                <div class="p-2 text-center" id="labComplete">1</div>
            </div>
        </div>
    </div>

    <!-- Add task, filter & render task -->
    <div class="container-fluid">
        <div class="row">

            <!-- Add task & filter -->
            <div class="col-12 col-md-5 col-lg-4 col-xl-3 d-flex flex-column">

                <!-- Add task -->
                <form class="m-1 d-flex flex-column  border rounded p-3" id="addForm">
                    <label class="form-label">Add new task</label>
                    <input type="text" class="form-control mb-3" id="inpTask" placeholder="Enter task name...">
                    <label class="form-label">Priority</label>
                    <select id="PrioritySelector" class="form-select mb-3">
                        <option value="3">Low</option>
                        <option value="2">Medium</option>
                        <option value="1">Height</option>
                    </select>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">From:</label>
                            <input type="date" class="form-control" id="from">
                        </div>
                        <div class="col-6">
                            <label class="form-label">To:</label>
                            <input type="date" class="form-control" id="deadline">
                        </div>
                    </div>
                    <button type="submit"
                        class="btn btn-primary rounded-5 align-self-end">Add<span>&plus;</span></button>
                </form>

                <!-- Filter -->
                <div class="card mx-1 mt-3">
                    <div class="card-header text-center fw-bold">Filter</div>
                    <form class="card-body d-flex justify-content-around">
                        <div>
                            <input type="checkbox" class="form-check-input" value="active" id="Active">
                            <label class="form-check-label">Active</label>
                        </div>
                        <div>
                            <input type="checkbox" class="form-check-input" value="complete" id="Complete">
                            <label class="form-check-label">Complete</label>
                        </div>
                        <div>
                            <input type="checkbox" class="form-check-input" value="priority" id="Priority">
                            <label class="form-check-label">Priority</label>
                        </div>
                    </form>
                </div>

            </div>

            <!-- task render -->
            <div class="col-12 col-md-7 col-lg-8 col-xl-9">

                <!-- Search bar -->
                <div class="d-flex justify-content-center align-items-center mx-1 mt-3 mt-sm-1">
                    <form class="input-group" id="searchBar">
                        <span class="material-symbols-outlined text-secondary input-group-text" id="icon">search</span>
                        <input type="text" class="form-control" id="search" placeholder="Search...">
                    </form>
                </div>

                <div class="mx-1 mt-3 mt-sm-4" id="taskFrame">
                    <!-- Output -->

                </div>
            </div>
        </div>
    </div>

    <!-- modal -->
    <div class="modal fade" id="delModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Delete task</h1>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Do you want to Delete this task?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" id="cancel">Cancel</button>
                    <button class="btn btn-danger" id="delete">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Boot Strap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
