<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo_Project</title>

    <!-- Boot Strap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- icon -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Search bar -->
    <div class="d-flex justify-content-center align-items-center container-fluid my-3 px-sm-5">
        <form class="input-group mx-sm-5 px-sm-5" id="searchBar">
            <span class="material-symbols-outlined text-secondary input-group-text" id="icon">search</span>
            <input type="text" class="form-control" id="search" placeholder="Search...">
        </form>
    </div>

    <!-- task report -->
    <div class="container-fluid my-3">
        <div class="row border rounded m-1">
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">All</div>
                <div class="p-2 text-center" id="labAll">1</div>
            </div>
            <div class="col-4 border-end">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Active</div>
                <div class="p-2 text-center" id="labActive">1</div>
            </div>
            <div class="col-4">
                <div class="border-bottom text-center text-sm-start p-2 fw-bolder">Complete</div>
                <div class="p-2 text-center" id="labComplete">1</div>
            </div>
        </div>
    </div>

    <!-- Add task & render task -->
    <div class="container-fluid">
        <div class="row">

            <!-- Add task -->
            <div class="col-12 col-md-4 col-lg-3">
                <form class="m-1 d-flex flex-column align-items-end border rounded p-3" id="addForm">
                    <input type="text" class="form-control mb-3" id="inpTask">
                    <button type="submit" class="btn btn-primary rounded-5">Add<span>&plus;</span></button>
                </form>
            </div>

            <!-- task render -->
            <div class="col-12 col-md-8 col-lg-9">
                <div class="mt-3 mx-1 mt-sm-1 me-sm-3" id="taskFrame">
                    <!-- Output -->

                </div>
            </div>
        </div>
    </div>
    <!-- Boot Strap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
