<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo_Project</title>

    <!-- Boot Strap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Search bar -->
    <div class="container-fluid my-3">
        <form class="d-flex gap-2">
            <input type="text" class="form-control" placeholder="Search">
            <button type="submit" class="btn btn-primary">Enter</button>
        </form>
    </div>

    <!-- task report -->
    <div class="container-fluid mb-3">
        <div class="row border rounded m-1">
            <div class="col-4 border-end">
                <div class="border-bottom p-2">All</div>
                <div class="p-2 text-center">1%</div>
            </div>
            <div class="col-4 border-end">
                <div class="border-bottom p-2">Complete</div>
                <div class="p-2 text-center">1%</div>
            </div>
            <div class="col-4">
                <div class="border-bottom p-2">Active</div>
                <div class="p-2 text-center">1%</div>
            </div>
        </div>
    </div>

    <!-- Add task & render task -->
    <div class="container-fluid">
        <div class="row m-1">

            <!-- Add task -->
            <div class="col-3 border rounded">
                <form class="m-3 d-flex flex-column align-items-end">
                    <input type="text" class="form-control mb-3">
                    <button type="submit" class="btn btn-outline-primary rounded-5">Add<span>&plus;</span></button>
                </form>
            </div>

            <!-- task render -->
            <div class="col-9">
                <!-- Output -->
            </div>
        </div>
    </div>
    <!-- Boot Strap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
